// hlfr_etf2l_rename.cfg — plugin HLFR ETF2L Rename
// Ce fichier est généré automatiquement par AutoExecConfig (cf. hlfr_etf2l_rename.sp).
// Renseignez vos valeurs réelles puis relancez le serveur (ou "exec hlfr_etf2l_rename").

// Active/désactive le renommage ETF2L.
hlfr_etf2l_enable "1"

// URL publique du site (endpoint de résolution des pseudos). Doit être accessible
// depuis le serveur de jeu.
hlfr_etf2l_url "https://highlanderfrance.tf/api/server/etf2l-names"

// Serveur 100% match (TFTrue) : mettre 0 pour armer le renommage à chaque manche,
// sans dépendre de mp_tournament. Laisser 1 sur un serveur mixte/public.
hlfr_etf2l_require_tournament "1"

// Nombre minimum de joueurs humains en équipe pour armer le renommage
// (16 = highlander, 10 = 6v6).
hlfr_etf2l_min_players "16"

// Re-forcer le pseudo ETF2L si le joueur se renomme manuellement pendant le match.
// 0 = renommage unique au démarrage du match (le joueur peut rechanger son nom).
hlfr_etf2l_enforce "1"

// Restaurer les noms Steam d'origine à la fin du match (game_over ou changement
// de carte). 0 = les joueurs gardent leur pseudo ETF2L jusqu'à la déconnexion.
hlfr_etf2l_restore "1"

// Logs de debug dans la console du serveur.
hlfr_etf2l_debug "0"
