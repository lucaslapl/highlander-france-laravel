// hlfr_match_log.cfg — plugin HLFR Match Log Webhook
// Ce fichier est généré automatiquement par AutoExecConfig (cf. hlfr_match_log.sp).
// Renseignez vos valeurs réelles puis relancez le serveur (ou "exec hlfr_match_log").

// Active/désactive le webhook.
hlfr_enable "1"

// URL publique du site (endpoint webhook). Doit être accessible depuis le serveur de jeu.
hlfr_webhook_url "https://highlanderfrance.tf/api/server/match-ended"

// Secret partagé — DOIT correspondre à SERVER_WEBHOOK_TOKEN dans config/.env du site.
// À changer impérativement.
hlfr_webhook_token "CHANGEZ-MOI"

// Nom du serveur de match (affiché dans les logs du site). Vide = hostname.
hlfr_server_name ""

// Délai avant envoi : laisse TFTrue finir l'upload du log sur logs.tf.
hlfr_delay "30.0"

// Nombre de nouvelles tentatives si le webhook échoue.
hlfr_max_retries "3"

// Logs de debug dans la console du serveur.
hlfr_debug "0"

// Serveur 100% match (TFTrue) : mettre 0 pour déclencher le webhook sur chaque
// game_over, sans dépendre de mp_tournament. Laisser 1 sur un serveur mixte/public.
hlfr_require_tournament "1"
