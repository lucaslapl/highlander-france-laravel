// hlfr_live_match.cfg — plugin HLFR Live Match
// Ce fichier est généré automatiquement par AutoExecConfig (cf. hlfr_live_match.sp).
// Renseignez vos valeurs réelles puis relancez le serveur (ou "exec hlfr_live_match").

// Active/désactive l'envoi du statut live au site.
hlfr_live_enable "1"

// URL publique du site (endpoint live). Doit être accessible depuis le serveur de jeu.
hlfr_live_url "https://highlanderfrance.tf/api/server/live-status"

// Intervalle (secondes) entre deux mises à jour pendant un match.
// 120 s = une mise à jour toutes les 2 minutes (les événements importants,
// comme une manche gagnée ou un changement de joueurs, déclenchent un envoi immédiat).
hlfr_live_interval "120.0"

// Logs de debug dans la console du serveur.
hlfr_live_debug "0"

// Serveur 100% match (TFTrue) : mettre 0 pour considérer chaque manche comme un
// match en direct, sans dépendre de mp_tournament. Laisser 1 sur un serveur mixte/public.
hlfr_live_require_tournament "1"

// URL SourceTV manuelle (ex: steam://connect/185.xxx.x.x:27020). Vide = construction
// automatique à partir de hostip + tv_port. Obligatoire si le serveur est derrière un NAT.
hlfr_live_stv_url ""

// Envoyer le mot de passe SourceTV (tv_password) au site pour l'afficher aux spectateurs.
hlfr_live_stv_include_password "0"
