services:
  mysql:
    image: mysql:8.4
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./.docker/mysql/init:/docker-entrypoint-initdb.d:ro
    environment:
      - MYSQL_DATABASE=highlander_france
      - MYSQL_USER=highlander
      - MYSQL_PASSWORD=highlander
      - MYSQL_ROOT_PASSWORD=root
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=highlander_france
      - DB_USERNAME=highlander
      - DB_PASSWORD=highlander
    command: php artisan serve --host=0.0.0.0 --port=8000 --no-reload

  test:
    build: .
    volumes:
      - .:/var/www/html
    command: composer test

volumes:
  mysql-data: